<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ไม่อนุมัติคำขอลา</title>
<style>
body{margin:0;background:#f3f5f7;font-family:Arial,"Noto Sans Thai",sans-serif;color:#222}
.box{max-width:520px;margin:30px auto;padding:20px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 5px 20px #0001}
h1{font-size:23px;margin:0 0 8px}.muted{color:#666;line-height:1.5}
.info{background:#f7f7f7;border-radius:10px;padding:14px;margin:18px 0}
textarea{width:100%;height:130px;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit;resize:vertical;margin-top:8px}
button{width:100%;border:0;border-radius:10px;background:#c62828;color:white;padding:14px;margin-top:15px;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}.err{display:none;color:#c62828;margin-top:9px}.loading{display:none;text-align:center;color:#666;margin-top:10px}.success{display:none;text-align:center;padding:25px 0}
</style>
</head>
<body>
<div class="box"><div class="card">
<h1>❌ ไม่อนุมัติคำขอลา</h1>
<p class="muted">กรุณาระบุเหตุผลก่อนยืนยันการไม่อนุมัติ</p>
<div class="info"><b>เลขที่คำขอ:</b> <span id="requestId">กำลังโหลด...</span></div>

<div id="main">
<label><b>เหตุผลที่ไม่อนุมัติ *</b></label>
<textarea id="reason" placeholder="กรุณาระบุเหตุผลที่ไม่อนุมัติ"></textarea>
<div class="err" id="err"></div>
<button id="btn" type="button">ยืนยันไม่อนุมัติ</button>
<div class="loading" id="loading">กำลังบันทึกข้อมูล...</div>
</div>

<div class="success" id="success">
<h2>✓ ไม่อนุมัติเรียบร้อย</h2>
<p>บันทึกเหตุผลแล้ว และระบบจะดำเนินการแจ้งพนักงานทาง LINE</p>
</div>
</div></div>

<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbzh-qFLiriNI-j6bHS6jHVwN5tat0wGEo7DnFRr7PoC41z18bt8EDqStvRK1yctI494/exec';
const qs=new URLSearchParams(location.search);
const token=qs.get('token')||'';
const leaveId=qs.get('leaveId')||qs.get('requestId')||qs.get('id')||'';

document.getElementById('requestId').textContent=leaveId||'ไม่พบเลขที่คำขอ';

function showError(t){const e=document.getElementById('err');e.textContent=t;e.style.display='block'}

document.getElementById('btn').onclick=function(){
 const reason=document.getElementById('reason').value.trim();
 document.getElementById('err').style.display='none';

 if(!token){showError('ไม่พบ Token กรุณาเปิดลิงก์จากปุ่ม “ไม่อนุมัติ” ใน LINE');return}
 if(!reason){showError('กรุณาระบุเหตุผลที่ไม่อนุมัติ');return}

 this.disabled=true;
 document.getElementById('loading').style.display='block';

 // ใช้ form navigation ไป Apps Script แทน fetch
 // เพื่อไม่ติดปัญหา CORS ของ Google Apps Script
 const form=document.createElement('form');
 form.method='GET';
 form.action=WEB_APP_URL;
 form.style.display='none';

 const fields={
   action:'reject',
   decision:'reject',
   token:token,
   leaveId:leaveId,
   rejectionReason:reason
 };

 Object.keys(fields).forEach(k=>{
   const input=document.createElement('input');
   input.type='hidden';input.name=k;input.value=fields[k];
   form.appendChild(input);
 });

 document.body.appendChild(form);
 form.submit();
};
</script>
</body>
</html>
