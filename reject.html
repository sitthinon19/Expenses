<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ไม่อนุมัติใบเบิกค่าใช้จ่าย</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f9;font-family:Arial,"Noto Sans Thai",sans-serif;color:#222}
.container{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 18px rgba(0,0,0,.07)}
h1{font-size:22px;margin:0 0 8px;text-align:center;color:#c62828}
.info{text-align:center;color:#666;font-size:14px;margin-bottom:18px}
label{display:block;font-weight:600;margin:12px 0 6px}
textarea{width:100%;min-height:130px;padding:12px;border:1px solid #d9dee3;border-radius:10px;font:inherit;resize:vertical}
button{width:100%;margin-top:14px;border:0;border-radius:11px;padding:14px;background:#c62828;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.message{display:none;margin-top:14px;padding:12px;border-radius:10px;white-space:pre-line;text-align:center}
.success{background:#e8f7ed;color:#137333}.error{background:#fdecec;color:#c62828}
.small{font-size:12px;color:#777}
</style>
</head>
<body>
<div class="container"><div class="card">
<h1>ไม่อนุมัติใบเบิกค่าใช้จ่าย</h1>
<div id="info" class="info">กำลังตรวจสอบรายการ...</div>
<label for="reason">เหตุผลที่ไม่อนุมัติ *</label>
<textarea id="reason" required placeholder="กรุณาระบุเหตุผลที่ไม่อนุมัติ"></textarea>
<button id="submitBtn" type="button">ยืนยันไม่อนุมัติ</button>
<div id="message" class="message"></div>
<div class="small" style="margin-top:14px;text-align:center">เมื่อยืนยันแล้ว ระบบจะบันทึกเหตุผลและแจ้งพนักงานผ่าน LINE</div>
</div></div>
<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbzYxsvg3yPmwQhB5xqdv-rVV5RjS-_VL_kke0AcJBf-ZFMPPCrfjcZxn8m-P4lGF5EySA/exec';
const params=new URLSearchParams(location.search);
const token=params.get('token')||'';
const expenseId=params.get('expenseId')||'';
const info=document.getElementById('info');
const btn=document.getElementById('submitBtn');
if(expenseId) info.textContent='เลขที่ใบเบิก: '+expenseId;
else info.textContent='กำลังดำเนินการใบเบิกค่าใช้จ่าย';
function showMessage(text,ok){const el=document.getElementById('message');el.style.display='block';el.className='message '+(ok?'success':'error');el.textContent=text;}
async function submitReject(){
  const reason=document.getElementById('reason').value.trim();
  if(!token){showMessage('ไม่พบ Approval Token กรุณาเปิดจากปุ่มใน LINE อีกครั้ง',false);return;}
  if(!reason){showMessage('กรุณาระบุเหตุผลที่ไม่อนุมัติ',false);return;}
  btn.disabled=true;btn.textContent='กำลังบันทึก...';
  try{
    const r=await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'expenseApproval',token:token,decision:'reject',rejectionReason:reason})});
    if(!r.ok) throw new Error('Apps Script API error: HTTP '+r.status);
    const result=await r.json();
    if(!result||!result.success) throw new Error(result&&result.message?result.message:'ไม่สามารถบันทึกผลได้');
    showMessage(result.message||'บันทึกผลไม่อนุมัติเรียบร้อยแล้ว',true);
    btn.disabled=true;btn.textContent='บันทึกเรียบร้อยแล้ว';
    document.getElementById('reason').disabled=true;
  }catch(e){btn.disabled=false;btn.textContent='ยืนยันไม่อนุมัติ';showMessage(e.message||'เกิดข้อผิดพลาด',false);}
}
btn.addEventListener('click',submitReject);
</script>
</body>
</html>
