<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เบิกค่าใช้จ่าย</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f9;font-family:Arial,"Noto Sans Thai",sans-serif;color:#222}
.container{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 18px rgba(0,0,0,.07)}
h1{font-size:22px;margin:0 0 8px;text-align:center}
.user{text-align:center;color:#666;margin-bottom:16px;font-size:14px}
label{display:block;font-weight:600;margin:12px 0 6px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;max-width:100%;min-width:0;padding:11px 12px;border:1px solid #d9dee3;border-radius:10px;background:#fff}
input[type="date"]{
  display:block !important;
  width:92% !important;
  max-width:92% !important;
  min-width:0 !important;
  box-sizing:border-box !important;
  padding-left:10px;
  padding-right:10px;
}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:11px;padding:12px 14px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{width:100%;background:#111;color:#fff;font-weight:700}
.secondary{background:#eef1f4}
.danger{background:#c62828;color:#fff}
.message{display:none;margin-top:14px;padding:12px;border-radius:10px;white-space:pre-line;text-align:center}
.success{background:#e8f7ed;color:#137333}
.error{background:#fdecec;color:#c62828}
.loading{text-align:center;padding:25px;color:#666}
.hidden{display:none!important}
.section-title{font-size:17px;font-weight:700;margin:18px 0 8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid #e4e8ec;border-radius:12px;padding:12px;margin-top:10px;background:#fafbfc}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.remove{background:#fdecec;color:#c62828;padding:6px 9px;font-size:12px}
.history{margin-top:14px}
.history-card{border:1px solid #e4e8ec;border-radius:11px;padding:11px;margin-top:8px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef1f4;font-size:12px}
.small{font-size:12px;color:#777}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media(max-width:380px){.container{padding:10px}.card{padding:15px}.row{gap:7px}}
</style>
</head>
<body>
<div class="container"><div class="card">

<h1>💰 เบิกค่าใช้จ่าย</h1>
<div id="userInfo" class="user">กำลังตรวจสอบ LINE...</div>

<form id="expenseForm">
  <div class="section-title">รายการเบิก</div>
  <div id="items"></div>
  <button type="button" class="secondary" id="addItemBtn" style="width:100%;margin-top:10px">＋ เพิ่มรายการ</button>

  <label for="purpose">วัตถุประสงค์</label>
  <textarea id="purpose" placeholder="เช่น เดินทางไปพบลูกค้า / ซื้ออุปกรณ์สำนักงาน" required></textarea>

  <div class="item" style="margin-top:14px">
    <div style="display:flex;justify-content:space-between;font-weight:700">
      <span>ยอดรวม</span><span id="total">0.00 บาท</span>
    </div>
  </div>

  <button class="primary" id="submitBtn" type="submit" style="margin-top:12px">ส่งใบเบิก</button>
</form>

<div class="section-title">รายการของฉัน</div>
<button type="button" class="secondary" id="historyBtn" style="width:100%">ดูประวัติการเบิก</button>
<div id="history" class="history"></div>

<div id="message" class="message"></div>
</div></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>

const LIFF_ID = '2011333828-aMWRLpui';
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbysP0tyA-5YpcgUieO6IrMlcHbnqwektx-MaoeMhYYsgx2LJDJ3V2TvFfgEqrSsEBxkCg/exec';
let idToken = '';

async function initLiff() {
  try {
    await liff.init({liffId:LIFF_ID});
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken();
    const profile = await liff.getProfile();
    const u = document.getElementById('userInfo');
    if (u) u.textContent = profile.displayName ? 'สวัสดี คุณ ' + profile.displayName : 'กำลังใช้งาน HR mini';
    await pageInit();
  } catch(e) {
    showMessage('message', e.message || 'ไม่สามารถเริ่มต้น LIFF ได้', false);
  }
}
async function apiCall(payload){
  const r = await fetch(WEB_APP_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  });
  if(!r.ok) throw new Error('Apps Script API error: HTTP '+r.status);
  return r.json();
}
function showMessage(id,text,ok){
  const el=document.getElementById(id);
  if(!el)return;
  el.style.display='block';
  el.className='message '+(ok?'success':'error');
  el.textContent=text;
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}


let itemNo=0;

function addItem(){
  itemNo++;
  const n=itemNo;
  const el=document.createElement('div');
  el.className='item';
  el.dataset.no=n;
  el.innerHTML=`
    <div class="item-head"><strong>รายการที่ ${n}</strong><button type="button" class="remove">ลบ</button></div>
    <label>วันที่</label>
    <input type="date" class="expense-date" required>
    <label>ประเภทค่าใช้จ่าย</label>
    <select class="expense-type" required>
      <option value="">กำลังโหลด...</option>
    </select>
    <label>จำนวนเงิน (บาท)</label>
    <input type="number" class="amount" min="0.01" step="0.01" required>
    <label>รายละเอียด</label>
    <input type="text" class="item-purpose" placeholder="รายละเอียดรายการ">
    <label>ใบเสร็จ</label>
    <input type="file" class="receipt" accept="image/*,application/pdf">
    <div class="small">แนะนำไฟล์ไม่เกิน 8 MB</div>`;
  el.querySelector('.remove').onclick=()=>{el.remove();renumber();calcTotal();};
  el.querySelector('.amount').addEventListener('input',calcTotal);
  document.getElementById('items').appendChild(el);
  loadExpenseTypes(el.querySelector('.expense-type'));
  el.querySelector('.expense-date').value=new Date().toISOString().slice(0,10);
}
function renumber(){[...document.querySelectorAll('#items .item')].forEach((x,i)=>x.querySelector('strong').textContent='รายการที่ '+(i+1));}
function calcTotal(){
  let t=0; document.querySelectorAll('.amount').forEach(x=>t+=Number(x.value)||0);
  document.getElementById('total').textContent=t.toLocaleString('th-TH',{minimumFractionDigits:2})+' บาท';
}
async function loadExpenseTypes(select){
  try{
    // ExpenseTypes is intentionally loaded from a small public endpoint only if backend is extended.
    // For now use the same standard types created by setupHRMiniAllModules.
    const types=[
      ['TRAVEL','ค่าเดินทาง'],['FUEL','ค่าน้ำมัน'],['MEAL','ค่าอาหาร'],
      ['ACCOMMODATION','ค่าที่พัก'],['OFFICE','อุปกรณ์สำนักงาน'],
      ['TELEPHONE','ค่าโทรศัพท์/อินเทอร์เน็ต'],['OTHER','อื่น ๆ'],['ADVANCE','เงินทดรองจ่าย']
    ];
    select.innerHTML='<option value="">-- เลือกประเภท --</option>'+types.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
  }catch(e){select.innerHTML='<option value="">ไม่สามารถโหลดประเภทได้</option>';}
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    if(!file){resolve(null);return;}
    if(file.size>8*1024*1024){reject(new Error('ไฟล์ใบเสร็จต้องไม่เกิน 8 MB'));return;}
    const r=new FileReader();
    r.onload=()=>resolve({base64:r.result,name:file.name,mime:file.type});
    r.onerror=()=>reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    r.readAsDataURL(file);
  });
}
async function submitExpense(){
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='กำลังส่งข้อมูล...';
  try{
    const nodes=[...document.querySelectorAll('#items .item')];
    if(!nodes.length) throw new Error('กรุณาเพิ่มรายการค่าใช้จ่าย');
    const items=[];
    for(const el of nodes){
      const f=el.querySelector('.receipt').files[0];
      const rf=await fileToBase64(f);
      items.push({
        expenseDate:el.querySelector('.expense-date').value,
        expenseType:el.querySelector('.expense-type').value,
        amount:Number(el.querySelector('.amount').value),
        purpose:el.querySelector('.item-purpose').value.trim(),
        receiptBase64:rf?.base64||'',
        receiptName:rf?.name||'',
        receiptMimeType:rf?.mime||''
      });
    }
    const purpose=document.getElementById('purpose').value.trim();
    const result=await apiCall({action:'submitExpense',idToken,items,purpose});
    if(!result.success) throw new Error(result.message||'ส่งใบเบิกไม่สำเร็จ');
    showMessage('message','ส่งใบเบิกเรียบร้อยแล้ว\\nเลขที่: '+result.expenseId,true);
    document.getElementById('items').innerHTML=''; itemNo=0; addItem(); calcTotal();
    loadHistory();
  }catch(e){showMessage('message',e.message||'เกิดข้อผิดพลาด',false);}
  finally{btn.disabled=false;btn.textContent='ส่งใบเบิก';}
}
async function loadHistory(){
  const box=document.getElementById('history'); box.innerHTML='<div class="loading">กำลังโหลด...</div>';
  const r=await apiCall({action:'getExpenseHistory',idToken});
  if(!r.success){box.textContent=r.message||'โหลดไม่สำเร็จ';return;}
  box.innerHTML=r.items.length?r.items.map(x=>`
    <div class="history-card">
      <div style="font-weight:700">${escapeHtml(x.expenseId)}</div>
      <div class="small">${escapeHtml(x.date)} · ${Number(x.total).toLocaleString()} บาท</div>
      <div style="margin-top:5px">${escapeHtml(x.purpose)}</div>
      <div style="margin-top:6px"><span class="badge">${escapeHtml(x.status||'-')}</span> <span class="badge">${escapeHtml(x.paymentStatus||'-')}</span></div>
    </div>`).join(''):'ยังไม่มีรายการเบิก';
}
async function pageInit(){
  document.getElementById('addItemBtn').onclick=addItem;
  document.getElementById('expenseForm').onsubmit=e=>{e.preventDefault();submitExpense();};
  document.getElementById('historyBtn').onclick=loadHistory;
  addItem();
}

window.addEventListener('load',initLiff);
</script>
</body>
</html>
